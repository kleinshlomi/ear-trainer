<script>
let audioCtx = null;
let sampleBuffers = new Map();
let sampleLoadPromise = null;

const unlockBtn = document.getElementById("unlockBtn");
const audioBadge = document.getElementById("audioBadge");
const audioProgress = document.getElementById("audioProgress");
const audioHint = document.getElementById("audioHint");

const playBtn = document.getElementById("playBtn");
const replayBtn = document.getElementById("replayBtn");
const majorBtn = document.getElementById("majorBtn");
const minorBtn = document.getElementById("minorBtn");
const refC4Btn = document.getElementById("refC4Btn");

const statusEl = document.getElementById("status");
const bigAnswerEl = document.getElementById("bigAnswer");

let currentQuestion = null;

const SAMPLE_MAP = [
  { midi: 48, file: "assets/piano/C3.mp3"  },
  { midi: 51, file: "assets/piano/Ds3.mp3" },
  { midi: 54, file: "assets/piano/Fs3.mp3" },
  { midi: 57, file: "assets/piano/A3.mp3"  },
  { midi: 60, file: "assets/piano/C4.mp3"  },
  { midi: 63, file: "assets/piano/Ds4.mp3" },
  { midi: 66, file: "assets/piano/Fs4.mp3" },
  { midi: 69, file: "assets/piano/A4.mp3"  },
  { midi: 72, file: "assets/piano/C5.mp3"  },
];

function getCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  return audioCtx;
}

function assetUrl(relPath) {
  return new URL(relPath, window.location.href).toString();
}

async function fetchDecode(file) {
  const ctx = getCtx();

  const res = await fetch(assetUrl(file));

  if (!res.ok) {
    throw new Error("Failed loading " + file);
  }

  const arr = await res.arrayBuffer();

  return await ctx.decodeAudioData(arr);
}

async function loadAllSamples() {
  let loaded = 0;

  audioProgress.textContent = "דגימות: 0/" + SAMPLE_MAP.length;

  for (const s of SAMPLE_MAP) {
    try {
      const buf = await fetchDecode(s.file);

      sampleBuffers.set(s.midi, buf);

      loaded++;

      audioProgress.textContent =
        "דגימות: " + loaded + "/" + SAMPLE_MAP.length;

    } catch (err) {
      console.error(err);
    }
  }

  if (loaded === 0) {
    audioBadge.textContent = "טעינה נכשלה";
    return;
  }

  audioBadge.textContent = "סאונד הופעל";
  audioBadge.classList.remove("bad");
  audioBadge.classList.add("ok");

  statusEl.textContent = "מוכן.";
}

async function ensureAudioReady() {
  const ctx = getCtx();

  if (ctx.state === "suspended") {
    await ctx.resume();
  }

  if (!sampleLoadPromise) {
    sampleLoadPromise = loadAllSamples();
  }

  await sampleLoadPromise;

  return ctx;
}

function nearestSampleMidi(targetMidi) {
  const mids = Array.from(sampleBuffers.keys());

  let best = mids[0];
  let bestDist = Math.abs(targetMidi - best);

  for (const m of mids) {
    const d = Math.abs(targetMidi - m);

    if (d < bestDist) {
      bestDist = d;
      best = m;
    }
  }

  return best;
}

function rateForMidi(targetMidi, baseMidi) {
  return Math.pow(2, (targetMidi - baseMidi) / 12);
}

function playBuffer(ctx, buf, rate, when, dur) {
  const src = ctx.createBufferSource();

  src.buffer = buf;
  src.playbackRate.value = rate;

  const gain = ctx.createGain();

  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.linearRampToValueAtTime(0.9, when + 0.01);
  gain.gain.linearRampToValueAtTime(0.0001, when + dur);

  src.connect(gain);
  gain.connect(ctx.destination);

  src.start(when);
  src.stop(when + dur + 0.1);
}

async function playMidi(midi) {
  const ctx = await ensureAudioReady();

  const base = nearestSampleMidi(midi);

  const buf = sampleBuffers.get(base);

  const rate = rateForMidi(midi, base);

  playBuffer(ctx, buf, rate, ctx.currentTime + 0.02, 1);
}

async function playChord(midis) {
  const ctx = await ensureAudioReady();

  const now = ctx.currentTime + 0.02;

  for (const midi of midis) {
    const base = nearestSampleMidi(midi);

    const buf = sampleBuffers.get(base);

    const rate = rateForMidi(midi, base);

    playBuffer(ctx, buf, rate, now, 1);
  }
}

function randomQuestion() {
  const root = 60 + Math.floor(Math.random() * 12);

  const isMajor = Math.random() < 0.5;

  const notes = isMajor
    ? [root, root + 4]
    : [root, root + 3];

  currentQuestion = {
    quality: isMajor ? "major" : "minor",
    notes
  };

  playChord(notes);

  statusEl.textContent = "האזן וענה";
  bigAnswerEl.textContent = "";
}

function answer(q) {
  if (!currentQuestion) return;

  const ok = currentQuestion.quality === q;

  if (ok) {
    statusEl.textContent = "✅ נכון";
  } else {
    statusEl.textContent = "❌ לא נכון";
  }

  bigAnswerEl.textContent =
    currentQuestion.quality === "major"
      ? "מז'ור"
      : "מינור";
}

unlockBtn.addEventListener("click", async () => {
  await ensureAudioReady();
});

playBtn.addEventListener("click", () => {
  randomQuestion();
});

replayBtn.addEventListener("click", () => {
  if (currentQuestion) {
    playChord(currentQuestion.notes);
  }
});

majorBtn.addEventListener("click", () => {
  answer("major");
});

minorBtn.addEventListener("click", () => {
  answer("minor");
});

refC4Btn.addEventListener("click", () => {
  playMidi(60);
});

window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    randomQuestion();
  }

  if (e.code === "KeyR") {
    e.preventDefault();

    if (currentQuestion) {
      playChord(currentQuestion.notes);
    }
  }

  if (e.code === "KeyM") {
    answer("major");
  }

  if (e.code === "KeyN") {
    answer("minor");
  }

  if (e.code === "KeyC") {
    playMidi(60);
  }
});
</script>
